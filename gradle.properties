# 构建与 Kotlin 风格；不含机器路径与口令
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
# AGP 9 默认只为被测 buildType 建单测组件；Compose Preview 需要 release 也有单测组件，
# 否则 `./gradlew :app:tasks --all` 在创建 generateReleaseComposePreviewRunfiles 时失败。
android.onlyEnableUnitTestForTheTestedBuildType=false
